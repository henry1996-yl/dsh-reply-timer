name: henry1996-yl/dsh-reply-timer
category: ui
description:
  en: Shows a live reply timer under the composer with honest stall detection and a three-segment ledger (first token / tools / generation). The chip follows only the session it is mounted in.
  zh: 在输入框下方显示回复计时：由宿主事件驱动的真实心跳与停滞检测，以及首字 / 工具 / 生成三段账本。计时只跟随当前会话，多标签页不会串台。
