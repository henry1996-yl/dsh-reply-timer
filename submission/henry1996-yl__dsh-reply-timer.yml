# 投稿到 awesome-dsh-plugin 的条目文件（模板）
#
# 用法：把本文件复制到 awesome-dsh-plugin 仓库的 data/plugins/ 目录下，
# 并把文件名里的 henry1996-yl 改成你的 GitHub 用户名，例如：
#   data/plugins/henry__dsh-reply-timer.yml
# 同时把下面 url / name 里的 henry1996-yl 一起替换。详见 SUBMISSION.md。
#
# 注意：只有 description.en 是必填；描述里若出现「: 」（冒号+空格）必须整体加引号。

url: https://github.com/henry1996-yl/dsh-reply-timer
name: henry1996-yl/dsh-reply-timer
category: ui
description:
  en: Shows a live reply timer in the composer with honest stall detection, a three-segment ledger (first token / tools / generation), and a history-based reference range. Never fakes a countdown.
  zh: 在输入框下方显示回复计时：由宿主事件驱动的真实心跳与停滞检测、首字/工具/生成三段账本，以及按同类历史给出的参考用时区间。样本不足时不会编造倒计时。
